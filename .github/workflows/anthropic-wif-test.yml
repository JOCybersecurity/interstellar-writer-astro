name: anthropic-wif-tes
on: push
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01PcJH6vE5ioqc2toyKvkdbs",
            "organization_id": "d66a98a0-8803-4660-99af-feba0e51d2d7",
            "service_account_id": "svac_01DfFqwgKBVeAuctS8axpu2R",
            "workspace_id": "wrkspc_014S2BmNjmQEbCCsb1WsKobp"
          }
          JSON
